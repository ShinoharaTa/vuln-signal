[project]
name = "vuln-signal-collector"
version = "0.1.0"
description = "Collect CVE publications and updates from primary sources into a local SQLite work DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.28.0",
]

[project.scripts]
vuln-signal = "vuln_signal.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vuln_signal"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
